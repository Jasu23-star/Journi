function eventIcon(text) {
  const t = text.toLowerCase();
  if (t.includes('breakfast') || t.includes('dinner') || t.includes('lunch')) return '🍽';
  if (t.includes('airport') || t.includes('transfer') || t.includes('departure') || t.includes('arrive')) return '✈';
  if (t.includes('hotel') || t.includes('check-in')) return '⌂';
  if (t.includes('temple') || t.includes('shrine') || t.includes('gion')) return '⛩';
  if (t.includes('beach') || t.includes('cruise') || t.includes('sea') || t.includes('swim')) return '🌊';
  if (t.includes('shopping') || t.includes('market')) return '🛍';
  if (t.includes('spa') || t.includes('wellness') || t.includes('relax')) return '✦';
  return '📍';
}

function renderDestination(place) {
  const d = destinations[place] || destinations.santorini;
  document.title = `Catalysts | ${d.name}`;

  document.getElementById('navPlanButton').href = `index.html?destination=${encodeURIComponent(d.name)}#planner`;

  const attractions = d.attractions.map(a => `
    <article class="attraction-card">
      <img class="attraction-image" src="${a.image}" alt="${a.name}" onerror="this.src='${d.hero}'">
      <div class="attraction-body">
        <span>${a.type}</span>
        <h3>${a.name}</h3>
        <p>${a.text}</p>
      </div>
    </article>
  `).join('');

  const days = d.days.map((day, i) => {
    const title = day[0];
    const events = day.slice(1);
    const times = ['8:00 AM','10:00 AM','12:30 PM','3:00 PM','6:30 PM'];
    return `
      <article class="destination-day">
        <div class="destination-day-number">
          <small>DAY</small>
          <strong>${i + 1}</strong>
        </div>
        <div class="destination-day-content">
          <h3>${title}</h3>
          ${events.map((event, j) => `
            <div class="day-event">
              <time>${times[j]}</time>
              <span class="event-symbol">${eventIcon(event)}</span>
              <div>
                <strong>${event}</strong>
                <p>${j === 0 ? 'Start the day according to your Catalysts plan.' : j === events.length - 1 ? 'Keep this time flexible when possible.' : 'Recommended activity in your 5-day itinerary.'}</p>
              </div>
            </div>
          `).join('')}
        </div>
      </article>
    `;
  }).join('');

  document.getElementById('destinationContent').innerHTML = `
    <section class="destination-hero">
      <div class="destination-hero-bg" style="background-image:url('${d.hero}')"></div>
      <div class="destination-hero-shade"></div>
      <div class="destination-hero-content">
        <div class="destination-breadcrumb">

        </div>
        <span class="destination-country">${d.country}</span>
        <h1>${d.name}</h1>
        <p class="destination-intro">${d.intro}</p>
        <div class="destination-hero-actions">
          <a class="destination-plan-btn" href="index.html?destination=${encodeURIComponent(d.name)}#planner">Plan ${d.name} →</a>
          <a class="destination-back-btn" href="index.html#destinations">← All Destinations</a>
        </div>
      </div>
    </section>

    <section class="destination-main">
      <div class="destination-section-heading">
        <span class="eyebrow">MUST-SEE PLACES</span>
        <h2>Discover <em>${d.name}</em></h2>
        <p>Explore the highlights that make ${d.name} special. These places can also become activities inside your personalized Catalysts itinerary.</p>
      </div>

      <div class="attraction-grid">${attractions}</div>

      <div class="itinerary-section">
        <div class="itinerary-intro">
          <div class="destination-section-heading" style="margin-bottom:0">
            <span class="eyebrow">READY-MADE INSPIRATION</span>
            <h2>5 Days, <em>4 Nights</em></h2>
            <p>A complete example itinerary. You can change any activity later when you create your own Catalysts trip.</p>
          </div>
          <div class="trip-summary">
            <span>📅 ${d.duration}</span>
            <span>💰 ${d.budget}</span>
            <span>✦ ${d.style}</span>
          </div>
        </div>

        <div class="destination-itinerary">${days}</div>

        <div class="destination-tip">
          <strong>✦ Catalysts Tip</strong>
          <p>${d.tip}</p>
        </div>
      </div>

      <div class="destination-footer-cta itinerary-actions-cta">
        <div>
          <span class="eyebrow">YOUR NEXT STEP</span>
          <h2>How would you like to travel?</h2>
          <p>Use this ready-made ${d.name} itinerary as your starting point, or build a completely personalised trip with Catalysts.</p>

}

const place = new URLSearchParams(window.location.search).get('place') || 'santorini';
