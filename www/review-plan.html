    <textarea id="editDescription"></textarea>
    <div class="edit-box-actions">

</div>

let activeCustomer;
let editing = null;

function iconFor(text) {
  const t=text.toLowerCase();
  if(t.includes('breakfast')||t.includes('dinner')||t.includes('lunch')) return '🍽';
  if(t.includes('airport')||t.includes('transfer')||t.includes('departure')||t.includes('arrive')) return '✈';
  if(t.includes('hotel')||t.includes('check-out')||t.includes('check-in')) return '⌂';
  if(t.includes('temple')||t.includes('shrine')) return '⛩';
  if(t.includes('beach')||t.includes('cruise')||t.includes('sea')||t.includes('swim')) return '🌊';
  if(t.includes('shopping')||t.includes('market')) return '🛍';
  return '📍';
}

function renderPlan() {
  const d=customerPlans[activeCustomer] || customerPlans.camille;
  document.title='Journi | '+d.destination+' Plan';
  document.getElementById('customerPlanContent').innerHTML=`
    <section class="customer-plan-hero">
      <div class="customer-plan-hero-inner">
        <div>
          <p class="eyebrow">${d.name.toUpperCase()} · CUSTOMER PLAN</p>
          <h1>${d.destination}, <em>${d.country}</em></h1>
          <p>${d.intro}</p>
          <div class="customer-plan-meta"><span>📅 5 Days / 4 Nights</span><span>⭐ ${d.rating}</span><span>👤 ${d.name}</span><span>💰 Est. trip budget ${d.budget}</span></div>
        </div>
        <img class="customer-plan-image" src="${d.image}" alt="${d.destination}">
      </div>
    </section>
    <section class="customer-plan-main">
      <div class="customer-plan-head">
        <div>
          <p class="eyebrow dark">BUILD THIS CUSTOMER PLAN</p>
          <h2>${d.destination} · 5 Days / 4 Nights</h2>
          <p>Edit anything you want before confirming. Remove an attraction, replace a restaurant, change a time, or add your own activity.</p>
        </div>
        <div class="edit-mode-note">✎ <strong>Editable itinerary</strong><br>Nothing is built until you confirm.<br><b>Estimated trip budget: ${d.budget}</b></div>
      </div>
      <div class="trip-details-card review-trip-details">
        <div>
          <span class="eyebrow dark">YOUR TRIP DETAILS</span>
          <h3>Make this customer plan yours</h3>
          <p>This itinerary stays <strong>5 Days / 4 Nights</strong>. Enter your travelers and departure date for this 5 Days / 4 Nights plan.</p>
        </div>
        <div class="trip-details-form">
          <label>
            <span>TRAVELERS</span>
            <div class="number-control">
              <button type="button" onclick="changeReviewTravelers(-1)">−</button>
              <strong id="reviewTravelerCount">2</strong>
              <button type="button" onclick="changeReviewTravelers(1)">+</button>
            </div>
          </label>
          <label>
            <span>DEPARTURE DATE</span>
            <input id="reviewStartDate" type="date" onchange="updateReviewReturnDate()">
          </label>
          <label>
            <span>RETURN DATE · 4 NIGHTS</span>
            <input id="reviewEndDate" type="date" readonly>
          </label>
          
        </div>
        <p class="trip-form-error" id="reviewTripFormError"></p>
      </div>
      <div class="full-plan" id="fullPlan">
        ${d.days.map((day,di)=>`<article class="full-plan-day">
          <div class="full-day-header"><div class="full-day-number">${di+1}</div><div><h3>${day.title}</h3><span>Day ${di+1} · ${di===4?'Departure':'Explore & experience'}</span></div><span>5D / 4N</span></div>
          <div class="full-day-events">
            ${day.events.map((e,ei)=>`<div class="full-event" data-day="${di}" data-event="${ei}"><time>${e[0]}</time><span class="full-event-icon">${e[1] || iconFor(e[2])}</span><div><strong>${e[2]}</strong><p>${e[3]}</p></div><button class="edit-event-btn" onclick="openEdit(${di},${ei})">Edit</button></div>`).join('')}
          </div>
        </article>`).join('')}
      </div>
      <div class="book-panel">
        <div><strong>Ready to make this trip yours?</strong><p>Your edits are applied to this plan before building.</p></div>
        <button class="confirm-book-btn" onclick="confirmBooking()">Build This Plan →</button>
      </div>
    </section>`;
}

function openEdit(dayIndex,eventIndex){
  const e=customerPlans[activeCustomer].days[dayIndex].events[eventIndex];
  editing={dayIndex,eventIndex};
  document.getElementById('editTitle').value=e[2];
  document.getElementById('editDescription').value=e[3];
  document.getElementById('editModal').classList.add('show');
  document.getElementById('editModal').setAttribute('aria-hidden','false');
  document.getElementById('editTitle').focus();
}
function closeEdit(){
  document.getElementById('editModal').classList.remove('show');
  document.getElementById('editModal').setAttribute('aria-hidden','true');
  editing=null;
}
function saveEdit(){
  if(!editing) return;
  const title=document.getElementById('editTitle').value.trim();
  const desc=document.getElementById('editDescription').value.trim();
  if(!title) return;
  const e=customerPlans[activeCustomer].days[editing.dayIndex].events[editing.eventIndex];
  e[2]=title; e[3]=desc || 'Custom activity added by you.'; e[1]=iconFor(title);
  closeEdit(); renderPlan(); showToast('Your itinerary was updated.');
}
function saveReviewBooking(){
  const start=document.getElementById('reviewStartDate')?.value || '';
  const end=document.getElementById('reviewEndDate')?.value || '';
  const d=customerPlans[activeCustomer] || customerPlans.camille;
  const booking={
    id:'booking-'+Date.now(), source:'customer-plan', customer:activeCustomer, customerName:d.name, destination:d.destination, country:d.country, image:d.image,
    travelers:reviewTravelerCount, startDate:start, endDate:end, duration:'5 Days / 4 Nights', budget:d.budget, days:JSON.parse(JSON.stringify(d.days)), bookedAt:new Date().toISOString()
  };
  const existing=JSON.parse(localStorage.getItem('journiBookings')||'[]');
  existing.push(booking); localStorage.setItem('journiBookings',JSON.stringify(existing));
  return booking;
}
function confirmBooking(){
  const start=document.getElementById('reviewStartDate')?.value || '';
  if(!start){ showToast('Please select your departure date first.'); return; }
  updateReviewReturnDate();
  const booking=saveReviewBooking();
  showToast('Trip built and added to My Plan ✓');
  setTimeout(()=>window.location.href='booking-detail.html?id='+encodeURIComponent(booking.id),650);
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show-toast');
  setTimeout(()=>t.classList.remove('show-toast'),2800);
}

let reviewTravelerCount=2;
function changeReviewTravelers(amount){
  reviewTravelerCount=Math.max(1,Math.min(20,reviewTravelerCount+amount));
  document.getElementById('reviewTravelerCount').textContent=reviewTravelerCount;
}
function localDateString(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function updateReviewReturnDate(){
  const start=document.getElementById('reviewStartDate').value;
  const end=document.getElementById('reviewEndDate');
  if(!start){end.value='';return;}
  const d=new Date(start+'T00:00:00'); d.setDate(d.getDate()+4);
  end.value=localDateString(d);
  document.getElementById('reviewTripFormError').textContent='';
  const summary=document.getElementById('reviewDateSummary');
  if(summary && end.value) summary.textContent=formatDate(start)+' → '+formatDate(end.value);
  const ts=document.getElementById('reviewTravelerSummary');
  if(ts) ts.textContent=reviewTravelerCount+(reviewTravelerCount===1?' Traveler':' Travelers');
}
function startReviewPlan(){
  const start=document.getElementById('reviewStartDate').value;
  const error=document.getElementById('reviewTripFormError');
  if(!start){error.textContent='Please select your departure date.';return;}
  updateReviewReturnDate();
  const end=document.getElementById('reviewEndDate').value;
  const nights=Math.round((new Date(end+'T00:00:00')-new Date(start+'T00:00:00'))/86400000);
  if(nights!==4){error.textContent='This itinerary is fixed at 5 Days / 4 Nights. Your return date must be exactly 4 nights after departure.';return;}
  document.getElementById('fullPlan').style.display='block';
  error.textContent='';
  document.getElementById('fullPlan').scrollIntoView({behavior:'smooth',block:'start'});
}

activeCustomer=new URLSearchParams(location.search).get('customer') || 'camille';
renderPlan();
</script>

<script>
  // Keep bookings created by an older version when upgrading to Journi.
  if (!localStorage.getItem('journiBookings') && localStorage.getItem('catalystsBookings')) {
    localStorage.setItem('journiBookings', localStorage.getItem('catalystsBookings'));
  }
</script>
<button class="back-to-top" type="button" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ <span>Top</span></button>
